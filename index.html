<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Trip%20Tracker%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%7D">
<title>Trip Tracker</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--tx:#14201f;--mut:#5f6f6d;--ln:#dde4e3;--pri:#0f766e;--pt:#fff;--red:#b42318;--grn:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#17211f;--tx:#e8f0ef;--mut:#92a3a0;--ln:#2a3836;--pri:#2dd4bf;--pt:#06201c;--red:#f97066;--grn:#4ade80}}
:root[data-theme="dark"]{--bg:#0e1514;--card:#17211f;--tx:#e8f0ef;--mut:#92a3a0;--ln:#2a3836;--pri:#2dd4bf;--pt:#06201c;--red:#f97066;--grn:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pri);color:var(--pt);padding:14px 16px;font-weight:700;font-size:18px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mut);font-size:14px;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}.row>*{flex:1}.row button.x{flex:0 0 40px}
h3{margin:0 0 4px;font-size:15px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:var(--pt);font-weight:700;font-size:16px;margin-top:12px}
.sm{padding:8px 12px;border:1px dashed var(--pri);background:none;color:var(--pri);border-radius:8px;font-weight:600;width:auto}
.x{border:0;background:none;color:var(--red);font-size:20px}
.calc div{display:flex;justify-content:space-between;padding:4px 0}
.net{border-top:1px solid var(--ln);margin-top:6px;padding-top:8px!important;font-weight:700;font-size:18px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}.stat small{color:var(--mut)}.stat b{display:block;font-size:20px}
.tr{display:flex;justify-content:space-between;gap:8px}.tr small{color:var(--mut)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;font-weight:600}.seg button.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
.empty{text-align:center;color:var(--mut);padding:30px}
.models{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m{border:2px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);padding:8px;text-align:center;font-weight:700;font-size:14px}.m.on{border-color:var(--pri)}.m img{width:100%;height:90px;object-fit:contain;display:block;border-radius:8px;background:#fff;margin-bottom:4px}.ico{width:72px;flex:0 0 72px}.ico img{width:100%;height:48px;object-fit:contain;display:block;border-radius:6px;background:#fff}.del{border:0;background:none;color:var(--red);font-size:13px;padding:0}
</style></head>

let model='Wagon R';
const $=id=>document.getElementById(id);
const n=v=>parseFloat(v)||0;
const f=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const exp=t=>n(t.fuel)+t.tolls.reduce((s,x)=>s+n(x),0)+t.others.reduce((s,x)=>s+n(x.a),0);
const net=t=>n(t.amount)-exp(t);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('app').innerHTML=tab==='add'?addView():tab==='list'?listView():repView();
  if(tab==='add')calc();
}
function addView(){
  const vs=[...new Set(trips.map(t=>t.vehicle))],cs=[...new Set(trips.map(t=>t.customer))];
  return `<div class="card"><h3>Trip details</h3>
  <label>Customer</label><input id="cust" list="cl" placeholder="Customer name"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>Date</label><input id="date" type="date" value="${today()}">
  <label>Trip (From → To)</label><input id="trip" placeholder="e.g. Chennai → Bangalore">
  <label>Vehicle model</label><div class="models">${Object.keys(CAR).map(m=>`<button type="button" class="m ${m===model?'on':''}" onclick="model='${m}';render2()">${CAR[m]}${m}</button>`).join('')}</div>
  <label>Vehicle number</label><input id="veh" list="vl" placeholder="e.g. TN 21 AB 1234"><datalist id="vl">${vs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>Trip Amount (income)</label><input id="amt" type="number" inputmode="decimal" placeholder="0" oninput="calc()"></div>
  <div class="card"><h3>Fuel</h3><input id="fuel" type="number" inputmode="decimal" placeholder="Fuel cost" oninput="calc()"></div>
  <div class="card"><h3>Tolls</h3>${tolls.map((t,i)=>`<div class="row"><input type="number" inputmode="decimal" class="tl" placeholder="Toll ${i+1}" value="${t}" oninput="tolls[${i}]=this.value;calc()"><button class="x" onclick="tolls.splice(${i},1);if(!tolls.length)tolls=[''];render2()">✕</button></div>`).join('')}
  <button class="btn sm" onclick="tolls.push('');render2()">+ Add toll</button></div>
  <div class="card"><h3>Other expenses</h3>${others.map((o,i)=>`<div class="row"><input placeholder="Description" value="${esc(o.n)}" oninput="others[${i}].n=this.value"><input type="number" inputmode="decimal" placeholder="Amount" value="${o.a}" oninput="others[${i}].a=this.value;calc()"><button class="x" onclick="others.splice(${i},1);if(!others.length)others=[{n:'',a:''}];render2()">✕</button></div>`).join('')}
  <button class="btn sm" onclick="others.push({n:'',a:''});render2()">+ Add expense</button></div>
  <div class="card calc"><h3>Automatic calculation</h3><div><span>Income</span><span id="c1"></span></div><div><span>Fuel</span><span id="c2"></span></div><div><span>Tolls</span><span id="c3"></span></div><div><span>Other</span><span id="c4"></span></div><div><span>Total expenses</span><span id="c5"></span></div><div class="net"><span>Net profit</span><span id="c6"></span></div></div>
  <button class="btn" onclick="saveTrip()">Save Trip</button>`;
}
function render2(){const k=['cust','date','trip','veh','amt','fuel'].map(i=>$(i).value);render();['cust','date','trip','veh','amt','fuel'].forEach((i,j)=>$(i).value=k[j]);calc()}
function calc(){
  const a=n($('amt').value),fu=n($('fuel').value),tl=tolls.reduce((s,x)=>s+n(x),0),ot=others.reduce((s,x)=>s+n(x.a),0),tot=fu+tl+ot,p=a-tot;
  $('c1').textContent=f(a);$('c2').textContent=f(fu);$('c3').textContent=f(tl);$('c4').textContent=f(ot);$('c5').textContent=f(tot);
  $('c6').textContent=f(p);$('c6').className=p>=0?'pos':'neg';
}
function saveTrip(){
  const c=$('cust').value.trim(),v=$('veh').value.trim();
  if(!c||!v||!n($('amt').value)){alert('Please enter Customer, Vehicle and Amount.');return}
  trips.unshift({id:Date.now(),customer:c,date:$('date').value||today(),trip:$('trip').value.trim(),vehicle:v,model,amount:n($('amt').value),fuel:n($('fuel').value),tolls:tolls.filter(x=>n(x)),others:others.filter(o=>n(o.a)).map(o=>({n:o.n,a:n(o.a)}))});
  save();tolls=[''];others=[{n:'',a:''}];tab='list';render();
}
function listView(){
  if(!trips.length)return '<div class="empty">No trips yet. Add your first trip.</div>';
  return trips.map(t=>{const p=net(t);return `<div class="card"><div class="tr"><div class="ico">${CAR[t.model]||''}</div><div style="flex:1"><b>${esc(t.customer)}</b></div><b class="${p>=0?'pos':'neg'}">${f(p)}</b></div>
  <div class="tr"><small>${t.date} · ${esc(t.model||'')} ${esc(t.vehicle)}</small><small>Income ${f(t.amount)}</small></div>
  ${t.trip?`<small>${esc(t.trip)}</small><br>`:''}<small>Fuel ${f(t.fuel)} · Tolls ${f(t.tolls.reduce((s,x)=>s+n(x),0))} (${t.tolls.length}) · Other ${f(t.others.reduce((s,x)=>s+n(x.a),0))}</small><br>
  <button class="del" onclick="delTrip(${t.id})">Delete</button></div>`}).join('');
}
function delTrip(id){if(confirm('Delete this trip?')){trips=trips.filter(t=>t.id!==id);save();render()}}
function key(d){
  const dt=new Date(d+'T00:00:00');
  if(per==='month')return d.slice(0,7);
  const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day);
  return dt.toISOString().slice(0,10);
}
function label(k){
  if(per==='month')return new Date(k+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
  const s=new Date(k+'T00:00:00'),e=new Date(s);e.setDate(e.getDate()+6);
  const o={day:'numeric',month:'short'};return s.toLocaleDateString('en-IN',o)+' – '+e.toLocaleDateString('en-IN',o);
}
function repView(){return repView0()+backupCard()}
function backupCard(){return `<div class="card"><h3>Backup &amp; restore (stored on this device)</h3><small style="color:var(--mut)">Your trips are saved in this browser. Download a backup file to keep a copy on your phone or computer.</small><div class="row" style="margin-top:10px"><button class="btn sm" onclick="dl('json')">⬇ Backup (JSON)</button><button class="btn sm" onclick="dl('csv')">⬇ Excel (CSV)</button></div><button class="btn sm" onclick="$('imp').click()">⬆ Restore from backup</button><input id="imp" type="file" accept=".json" style="display:none" onchange="imp(this.files[0])"></div>`}
function dl(type){
  if(!trips.length){alert('No trips to export yet.');return}
  let data,name,mime;
  if(type==='json'){data=JSON.stringify(trips,null,1);name='trips-backup-'+today()+'.json';mime='application/json'}
  else{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';data='Date,Customer,Trip,Model,Vehicle,Amount,Fuel,Tolls,Other,Net\n'+trips.map(t=>[t.date,q(t.customer),q(t.trip),q(t.model||''),q(t.vehicle),t.amount,t.fuel,t.tolls.reduce((a,x)=>a+n(x),0),t.others.reduce((a,x)=>a+n(x.a),0),net(t)].join(',')).join('\n');name='trips-'+today()+'.csv';mime='text/csv'}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Download not supported here. Open the hosted copy of the app to download.')}
}
function imp(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;const ids=new Set(trips.map(t=>t.id));let c=0;d.forEach(t=>{if(t&&t.id&&!ids.has(t.id)&&t.customer){trips.push({...t,tolls:t.tolls||[],others:t.others||[]});c++}});trips.sort((a,b)=>b.id-a.id);save();alert(c+' trip(s) restored.');render()}catch(e){alert('That file is not a valid backup.')}};
  r.readAsText(file);
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function repView0(){
  const seg=`<div class="seg"><button class="${per==='week'?'on':''}" onclick="per='week';render()">Weekly</button><button class="${per==='month'?'on':''}" onclick="per='month';render()">Monthly</button></div>`;
  if(!trips.length)return seg+'<div class="empty">Add trips to see reports.</div>';
  const g={};
  trips.forEach(t=>{const k=key(t.date);g[k]=g[k]||{c:0,i:0,f:0,t:0,o:0};const r=g[k];r.c++;r.i+=n(t.amount);r.f+=n(t.fuel);r.t+=t.tolls.reduce((s,x)=>s+n(x),0);r.o+=t.others.reduce((s,x)=>s+n(x.a),0)});
  const ks=Object.keys(g).sort().reverse(),T={c:0,i:0,f:0,t:0,o:0};
  ks.forEach(k=>{for(const x in T)T[x]+=g[k][x]});
  const tp=T.i-T.f-T.t-T.o;
  const cur=g[ks[0]],cp=cur.i-cur.f-cur.t-cur.o;
  const vg={};trips.forEach(t=>{const kk=(t.model||'')+' '+t.vehicle;vg[kk]=(vg[kk]||0)+net(t)});
  return seg+`<div class="grid"><div class="stat"><small>Latest ${per}</small><b class="${cp>=0?'pos':'neg'}">${f(cp)}</b></div><div class="stat"><small>All-time profit</small><b class="${tp>=0?'pos':'neg'}">${f(tp)}</b></div><div class="stat"><small>Total income</small><b>${f(T.i)}</b></div><div class="stat"><small>Total expenses</small><b>${f(T.f+T.t+T.o)}</b></div></div>
  <div class="card scroll" style="margin-top:12px"><table><tr><th>Period</th><th>Trips</th><th>Income</th><th>Fuel</th><th>Tolls</th><th>Other</th><th>Net</th></tr>
  ${ks.map(k=>{const r=g[k],p=r.i-r.f-r.t-r.o;return `<tr><td>${label(k)}</td><td>${r.c}</td><td>${f(r.i)}</td><td>${f(r.f)}</td><td>${f(r.t)}</td><td>${f(r.o)}</td><td class="${p>=0?'pos':'neg'}"><b>${f(p)}</b></td></tr>`}).join('')}
  <tr><td><b>Total</b></td><td>${T.c}</td><td>${f(T.i)}</td><td>${f(T.f)}</td><td>${f(T.t)}</td><td>${f(T.o)}</td><td><b>${f(tp)}</b></td></tr></table></div>
  <div class="card"><h3>Profit by vehicle</h3>${Object.entries(vg).map(([v,p])=>`<div class="tr"><span>${esc(v)}</span><b class="${p>=0?'pos':'neg'}">${f(p)}</b></div>`).join('')}</div>`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script>
</body></html>
